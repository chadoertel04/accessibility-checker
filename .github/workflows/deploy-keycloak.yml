name: Deploy Keycloak

# Ships deploy/keycloak/ to the VPS over SSH and (re)starts the stack.
# Setup steps are in README.md under "Deploying Keycloak".

on:
  push:
    branches:
      - main
    paths:
      - deploy/keycloak/**
      - .github/workflows/deploy-keycloak.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keycloak
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: keycloak
    env:
      KEYCLOAK_SSH_USER: ${{ vars.KEYCLOAK_SSH_USER }}
      KEYCLOAK_SSH_HOST: ${{ vars.KEYCLOAK_SSH_HOST }}
      SSH_TARGET: ${{ vars.KEYCLOAK_SSH_USER }}@${{ vars.KEYCLOAK_SSH_HOST }}
      KEYCLOAK_DOMAIN: ${{ vars.KEYCLOAK_DOMAIN }}
      APP_URL: ${{ vars.APP_URL }}
      APP_ORIGIN: ${{ vars.APP_ORIGIN }}
      KEYCLOAK_DB_PASSWORD: ${{ secrets.KEYCLOAK_DB_PASSWORD }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=0
          for name in KEYCLOAK_SSH_USER KEYCLOAK_SSH_HOST KEYCLOAK_DOMAIN APP_URL APP_ORIGIN \
                      KEYCLOAK_DB_PASSWORD KEYCLOAK_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          # Unquoted values in Docker's .env break on spaces, quotes or '#'.
          for name in KEYCLOAK_DB_PASSWORD KEYCLOAK_ADMIN_PASSWORD; do
            if [[ "${!name}" =~ [[:space:]\"\'#\$] ]]; then
              echo "::error::$name must not contain spaces, quotes, # or \$ (use openssl rand -hex 32)"; missing=1
            fi
          done
          exit $missing

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KEYCLOAK_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.KEYCLOAK_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Upload stack
        run: |
          tar -C deploy/keycloak --exclude=.env --exclude=.env.example -cz . \
            | ssh "$SSH_TARGET" 'mkdir -p ~/keycloak && tar -xz -C ~/keycloak'

      - name: Write server .env
        run: |
          printf '%s\n' \
            "KEYCLOAK_DOMAIN=$KEYCLOAK_DOMAIN" \
            "APP_URL=$APP_URL" \
            "APP_ORIGIN=$APP_ORIGIN" \
            "KEYCLOAK_DB_PASSWORD=$KEYCLOAK_DB_PASSWORD" \
            "KEYCLOAK_ADMIN_PASSWORD=$KEYCLOAK_ADMIN_PASSWORD" \
            | ssh "$SSH_TARGET" 'umask 077 && cat > ~/keycloak/.env'

      - name: Start stack
        run: |
          ssh "$SSH_TARGET" 'cd ~/keycloak && docker compose pull --quiet && docker compose up -d --remove-orphans --wait --wait-timeout 300'

      - name: Check public endpoint
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors \
            "https://$KEYCLOAK_DOMAIN/realms/accessibility-app/.well-known/openid-configuration" > /dev/null
          echo "Keycloak is live at https://$KEYCLOAK_DOMAIN"
